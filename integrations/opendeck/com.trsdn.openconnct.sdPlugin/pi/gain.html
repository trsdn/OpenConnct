<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="inspector.css">
</head>
<body>
    <label for="microphone">Microphone</label>
    <select id="microphone"></select>

    <label for="step">Each press changes the gain by</label>
    <select id="step">
        <option value="-6">−6 dB</option>
        <option value="-3">−3 dB</option>
        <option value="-1">−1 dB</option>
        <option value="1">+1 dB</option>
        <option value="3">+3 dB</option>
        <option value="6">+6 dB</option>
    </select>
    <p class="note" id="note"></p>

    <script src="inspector.js"></script>
    <script>
        const select = document.getElementById("microphone");
        const step = document.getElementById("step");
        const note = document.getElementById("note");

        OpenConnctPI.ready(({ settings, options }) => {
            fillSelect(select, options.channels, settings.name, "The only one found");
            step.value = settings.step ?? "1";
            note.textContent = options.running
                ? "The key shows the microphone's current gain. Put one key on +, another on −."
                : "OpenConnct is not reachable, so there are no microphones to list yet. Switch on “Control from other apps” in its Technical details.";
            note.className = options.running ? "note" : "note warning";
            select.onchange = () => OpenConnctPI.save({ name: select.value });
            step.onchange = () => OpenConnctPI.save({ step: step.value });
        });
    </script>
</body>
</html>
