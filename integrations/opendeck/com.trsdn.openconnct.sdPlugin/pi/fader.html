<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="inspector.css">
</head>
<body>
    <label for="microphone">Microphone</label>
    <select id="microphone"></select>

    <label for="step">Each press changes the level by</label>
    <select id="step">
        <option value="-6">−6 dB</option>
        <option value="-3">−3 dB</option>
        <option value="-1">−1 dB</option>
        <option value="1">+1 dB</option>
        <option value="3">+3 dB</option>
        <option value="6">+6 dB</option>
    </select>

    <label for="label">Label on the key (optional)</label>
    <input id="label" type="text" maxlength="12" placeholder="Defaults to the microphone's name">
    <p class="note" id="note"></p>

    <script src="inspector.js"></script>
    <script>
        const select = document.getElementById("microphone");
        const label = document.getElementById("label");
        const note = document.getElementById("note");
        const step = document.getElementById("step");

        OpenConnctPI.ready(({ settings, options }) => {
            fillSelect(select, options.channels, settings.name, "The only one found");
            step.value = settings.step ?? "3";
            // Not while the field has focus: a settings round trip would put the
            // saved text back under the cursor mid-typing.
            if (document.activeElement !== label) label.value = settings.label ?? "";
            note.textContent = options.running
                ? "This is the fader in the mix, the level you see in the channel strip. Put one key on + and another on −."
                : "OpenConnct is not reachable, so there are no microphones to list yet. Switch on “Control from other apps” in OpenConnct's Settings (⌘,).";
            note.className = options.running ? "note" : "note warning";
            select.onchange = () => OpenConnctPI.save({ name: select.value });
            label.oninput = () => OpenConnctPI.save({ label: label.value });
            step.onchange = () => OpenConnctPI.save({ step: step.value });
        });
    </script>
</body>
</html>
