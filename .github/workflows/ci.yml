name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  naming-consistency:
    name: Naming consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The project was renamed from OpenConnect to OpenConnct (the original
      # name was already taken). These files intentionally still say
      # "OpenConnect" for migration/legacy-compat reasons, or to explain the
      # rename itself (see AGENTS.md and docs/self-assessment.md) — anywhere
      # else, it's a reintroduced typo. git grep only sees tracked files, so
      # this matches exactly what a fresh checkout (like this one) contains.
      - name: No stray "OpenConnect" references
        run: |
          set -euo pipefail
          allowed="
          AGENTS.md
          .github/workflows/ci.yml
          App/OpenConnctApp/Persistence/AppSupport.swift
          App/OpenConnctApp/Resources/install-driver.sh
          scripts/install_driver_dev.sh
          scripts/uninstall_driver.sh
          scripts/make_pkg.sh
          "
          status=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if ! grep -qxF "$path" <<<"$allowed"; then
              echo "::error file=$path::references \"OpenConnect\" but is not on the documented legacy-compat allowlist in this workflow"
              status=1
            fi
          done < <(git grep -lI "OpenConnect" || true)
          exit "$status"

  readme-badges:
    name: README badges
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Platform badge agrees with the deployment target
        run: scripts/check_badges.sh

  opendeck-plugin:
    name: OpenDeck plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 20 is the oldest Stream Deck runs plugins with, so it is the
      # strictest place to test them.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test the plugin
        working-directory: integrations/opendeck
        run: npm test

  core:
    name: Swift package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Core
        working-directory: Core
        run: swift build

      - name: Test Core
        working-directory: Core
        run: swift test

  build:
    name: Driver and app
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Unsigned, so this needs no secrets. It exists to catch compile breaks in
      # the HAL plug-in and the app, which the Core package alone cannot.
      - name: Build driver
        run: make driver

      # Exercises the driver's property dispatch and IO round trip through the
      # real AudioServerPlugIn vtable via dlopen. This is the only automated
      # check of driver *behaviour*: installing it for real needs sudo and a
      # coreaudiod restart, which CI cannot do.
      - name: Test driver (offline harness)
        run: make test-driver

      - name: Build app (universal)
        run: make build UNIVERSAL=1

      - name: Stage embedded driver
        run: make embed-driver UNIVERSAL=1
